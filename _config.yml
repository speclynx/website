# Site settings
title: SpecLynx
email: info@speclynx.com
tagline: One toolchain for every API spec
description: >-
  SpecLynx is one toolchain for every API spec: parse, validate, transform, and lint
  OpenAPI, AsyncAPI, Arazzo, Overlay, and JSON Schema. Local-first, free, and open source.
keywords: SpecLynx, ApiDOM, OpenAPI, AsyncAPI, Arazzo, Overlay, JSON Schema, Language Service, API tooling, API specifications
baseurl: ""
url: "https://speclynx.com"
github_username: speclynx

# Social
twitter:
  username: "@speclynx"
  card: summary_large_image

# Build settings
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  posts:
    output: true
    permalink: /blog/:title/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/images/social/speclynx-logo-full.png
        width: 1200
        height: 630
        alt: "SpecLynx logo"
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Vladimír Gorej"
      author_url: "https://vladimirgorej.com/"
      author_link: "/about/#vladimir-gorej"

# Exclude from processing
exclude:
  - CLAUDE.md
  - README.md
  - LICENSE
  - NOTICE
  - .gitignore
  - .idea
  - Gemfile
  - Gemfile.lock
  - vendor
  - archive
