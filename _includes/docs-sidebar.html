<!-- Sticky Sidebar: outline of the current guide, driven by page.toc -->
<aside class="page-sidebar lg:w-64 flex-shrink-0">
  <button type="button" class="page-sidebar-toggle" aria-expanded="false" aria-controls="page-sidebar-nav"><span class="page-sidebar-label"><span>On this page</span><span class="page-sidebar-current" hidden></span></span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg></button>
  <nav id="page-sidebar-nav" class="page-sidebar-nav lg:sticky lg:top-[82px] p-6 space-y-4 text-sm" aria-label="{{ page.sidebar_title | default: page.title }}">
    <a href="{{ '/docs/' | relative_url }}#guides" class="block text-gray-500 hover:text-primary-light">&larr; Guides</a>
    <p class="font-bold text-primary-dark">{{ page.sidebar_title | default: page.title }}</p>
    <ol class="space-y-2">
      {% for item in page.toc %}
      <li><a href="#{{ item.anchor }}" class="block text-gray-600 hover:text-primary-light">{{ item.title }}</a></li>
      {% endfor %}
    </ol>
  </nav>
</aside>
